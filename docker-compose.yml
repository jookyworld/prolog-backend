version: "3.8"

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: prolog-npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81" # 관리자 웹 UI
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - spring-app
    networks:
      - prolog-network
    restart: unless-stopped

  spring-app:
    image: jookyworld/prolog-backend:latest
    container_name: prolog-backend
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy # DB가 완전히 뜬 후 앱 실행
    networks:
      - prolog-network

  mysql:
    image: mysql:8.4
    container_name: prolog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: prolog
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - prolog-mysql-data:/var/lib/mysql
    networks:
      - prolog-network
    healthcheck: # 앱이 DB 연결을 시도하기 전 상태 체크
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prolog-redis
    networks:
      - prolog-network

networks:
  prolog-network:
    driver: bridge

volumes:
  prolog-mysql-data:
  npm-data:
  npm-letsencrypt:
