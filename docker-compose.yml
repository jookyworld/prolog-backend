version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: prolog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: prolog
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - prolog-mysql-data:/var/lib/mysql

volumes:
  prolog-mysql-data:
